name: Agent evaluations

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Native API cases, programming/file tasks, or both
        type: choice
        options: [workspace, all, native]
        default: workspace
      model:
        description: Model for the independent Sandcrab tasks
        type: choice
        options: [deepseek-flash]
        default: deepseek-flash
      repeats:
        description: Trials per case
        type: choice
        options: ['3', '1', '5']
        default: '3'
      budget_usd:
        description: Total batch budget in USD, including uncertain-call reservations (maximum 5)
        type: string
        default: '1.00'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Validate the paid run before starting its evaluator
        run: python3 evals/check_run.py
  native:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    uses: ./.github/workflows/evals.yml
    with:
      evidence_mode: model
      suite: ${{ inputs.suite }}
      model: ${{ inputs.model }}
      repeats: ${{ fromJSON(inputs.repeats) }}
      budget_usd: ${{ inputs.budget_usd }}
    secrets:
      model_key: ${{ secrets.DEEPSEEK_EVAL_API_KEY || ((vars.AI_REVIEW_BASE_URL == '' || vars.AI_REVIEW_BASE_URL == 'https://api.deepseek.com') && secrets.AI_REVIEW_API_KEY) || '' }}
