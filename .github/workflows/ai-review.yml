name: AI Review

on:
  pull_request_target:
    branches: [main, 'codex/phase-one-*']
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing owner pull request to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  # Metadata-only edits skip review and must not cancel an active source review.
  group: ai-review-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.event.action == 'edited' && github.event.changes.base == null && github.run_id || 'source' }}
  cancel-in-progress: true

jobs:
  review:
    # Only main supplies executable code and rules, including when a PR targets a stack branch.
    # Editing a title or body does not spend provider tokens. Retargeting a PR does need review.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.author_association == 'OWNER' &&
       (github.event.action != 'edited' || github.event.changes.base != null))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out trusted review implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            .github/review
            .agents/skills/review
            AGENTS.md
          sparse-checkout-cone-mode: false

      - name: Review complete fixed-commit diff
        env:
          AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          AI_REVIEW_BASE_URL: ${{ vars.AI_REVIEW_BASE_URL || 'https://api.deepseek.com' }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL || 'deepseek-v4-flash-vision-exp' }}
          GH_TOKEN: ${{ github.token }}
          REVIEW_OUTPUT: ${{ runner.temp }}/ai-review-results
        run: python3 .github/review/review.py

      - name: Retain complete review coverage and visible results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-review-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ai-review-results/
          if-no-files-found: error
          retention-days: 14
