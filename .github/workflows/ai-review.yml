name: AI Review
run-name: 'AI Review PR #${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || ''unresolved'' }}'

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing owner pull request to review
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  # Failed, skipped and superseded CI completions must not cancel a paid review. Workflow
  # concurrency is evaluated before the job-level condition below.
  group: ai-review-${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && (github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.run_id) || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    # Only main supplies executable code and rules, including when a PR targets a stack branch.
    # A PR's verify job must finish successfully before any provider request.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Check out trusted review implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            .github/review
            .agents/skills/review
            AGENTS.md
          sparse-checkout-cone-mode: false

      - name: Review fixed-commit diff and inspect repository code
        id: review
        env:
          AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          AI_REVIEW_BASE_URL: ${{ vars.AI_REVIEW_BASE_URL || 'https://api.deepseek.com' }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL || 'deepseek-flash' }}
          GH_TOKEN: ${{ github.token }}
          REVIEW_OUTPUT: ${{ runner.temp }}/ai-review-results
        run: python3 .github/review/review.py

      - name: Retain complete review coverage and visible results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-review-${{ steps.review.outputs.pr_number || 'unresolved' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ai-review-results/
            !${{ runner.temp }}/ai-review-results/session.json
          if-no-files-found: error
          retention-days: 14

      - name: Retain the resumable PR conversation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-review-session-${{ steps.review.outputs.pr_number || 'unresolved' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ai-review-results/session.json
          if-no-files-found: ignore
          retention-days: 90
