name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches:
      - main

permissions:
  contents: read

# Pull-request runs may be superseded; a main run carries publication and deployment, which
# must finish once started.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && github.event.changes.base == null && github.run_id || 'source' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # An ignored metadata edit must neither cancel verification nor publish a skipped check
    # named "verify" that could replace the required result for the same commit.
    name: ${{ github.event.action == 'edited' && github.event.changes.base == null && 'metadata-only' || 'verify' }}
    # Title/body edits do not rerun verification; retargeting changes the tested base.
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Verify complete AI review transport
        run: python3 -m unittest discover -s .github/review -p "test_*.py" -v

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-home-cache-cleanup: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pin npm
        run: npm install --global npm@12.0.2

      - name: Set up Python for executor and proxy tests
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.14"

      - name: Verify
        run: ./gradlew check --no-daemon

      - name: Upload verification reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-reports-${{ github.run_id }}
          path: |
            build/reports/
            build/test-results/
            build/proxy-forwarding/
          if-no-files-found: ignore
          retention-days: 7

  # Only a verified main commit of the canonical repository becomes an image. This is the only
  # job with package-write authority.
  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'core607/poketto'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.summary.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      frontend_image: ${{ steps.summary.outputs.frontend_image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Describe image
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=main

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: POKETTO_REVISION=${{ github.sha }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: POKETTO_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}-frontend:main
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Record publication
        id: summary
        run: |
          image="ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          frontend_image="ghcr.io/${{ github.repository }}-frontend@${{ steps.frontend.outputs.digest }}"
          echo "frontend_image=$frontend_image" >> "$GITHUB_OUTPUT"
          db_image="$(grep '^POKETTO_DB_IMAGE=' deploy/.env.example | cut -d = -f 2-)"
          {
            echo "## Published image"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Source commit | \`${{ github.sha }}\` |"
            echo "| Application image | \`$image\` |"
            echo "| Frontend image | \`$frontend_image\` |"
            echo "| Database image | \`$db_image\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  mirror:
    needs: publish
    if: vars.POKETTO_MIRROR_REPOSITORY != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: quay.io/skopeo/stable@sha256:6c243579ceea16adaf6033c5626bce55a0bb1cfec50e973652306ee89aa8a753
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.copy.outputs.image }}
      frontend_image: ${{ steps.copy.outputs.frontend_image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Record registry copy client
        run: skopeo --version
      - name: Copy canonical digests to delivery mirror
        id: copy
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          FRONTEND_IMAGE: ${{ needs.publish.outputs.frontend_image }}
          REVISION: ${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          MIRROR_REPOSITORY: ${{ vars.POKETTO_MIRROR_REPOSITORY }}
          MIRROR_USERNAME: ${{ vars.POKETTO_MIRROR_USERNAME }}
          MIRROR_PASSWORD: ${{ secrets.POKETTO_MIRROR_PASSWORD }}
        run: bash deploy/mirror.sh

  # Production deployment runs only when the repository variable POKETTO_DEPLOY_ENABLED is
  # "true" and the production environment supplies the target. Consecutive main pushes queue
  # behind one another; an in-progress deployment is never cancelled. The content-repository
  # credential travels to the host's .env over the entrance's standard input, never as an
  # argument.
  deploy:
    needs: [publish, mirror]
    if: ${{ !cancelled() && needs.publish.result == 'success' && vars.POKETTO_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    # Full image archives may need a slow-link transfer window; updater deadlines remain bounded.
    timeout-minutes: 180
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check deployment configuration
        env:
          DEPLOY_TARGET: ${{ secrets.POKETTO_DEPLOY_TARGET }}
          DEPLOY_ROOT: ${{ vars.POKETTO_DEPLOY_ROOT }}
          DEPLOY_MODE: ${{ vars.POKETTO_DEPLOY_MODE }}
          DEPLOY_LAYOUT: ${{ vars.POKETTO_DEPLOY_LAYOUT }}
          MIRROR_REPOSITORY: ${{ vars.POKETTO_MIRROR_REPOSITORY }}
          MIRROR_RESULT: ${{ needs.mirror.result }}
          SSH_PRIVATE_KEY: ${{ secrets.POKETTO_DEPLOY_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.POKETTO_DEPLOY_HOST_KEY }}
          SSH_DIR: ${{ runner.temp }}/poketto-ssh
        run: |
          missing=()
          [ -n "$DEPLOY_TARGET" ] || missing+=("secret POKETTO_DEPLOY_TARGET (user@host)")
          [ -n "$DEPLOY_ROOT" ] || missing+=("variable POKETTO_DEPLOY_ROOT (absolute deployment root)")
          [ -n "$SSH_PRIVATE_KEY" ] || missing+=("secret POKETTO_DEPLOY_SSH_KEY")
          [ -n "$SSH_HOST_KEY" ] || missing+=("secret POKETTO_DEPLOY_HOST_KEY (known_hosts line)")
          case "${DEPLOY_MODE:-pull}" in
            pull|transfer) ;;
            mirror) [ -n "$MIRROR_REPOSITORY" ] && [ "$MIRROR_RESULT" = success ] || missing+=("mirror mode requires a successful configured mirror job") ;;
            *) missing+=("variable POKETTO_DEPLOY_MODE must be pull, transfer or mirror") ;;
          esac
          case "${DEPLOY_LAYOUT:-standard}" in
            standard) ;;
            existing) [[ "${DEPLOY_MODE:-pull}" = transfer || "$DEPLOY_MODE" = mirror ]] || missing+=("existing installations require transfer or mirror mode") ;;
            *) missing+=("variable POKETTO_DEPLOY_LAYOUT must be standard or existing") ;;
          esac
          if [ ${#missing[@]} -gt 0 ]; then
            echo "deployment is enabled but not configured:"
            printf -- '- %s\n' "${missing[@]}"
            exit 1
          fi
          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_DIR/deploy_key"
          printf '%s\n' "$SSH_HOST_KEY" > "$SSH_DIR/known_hosts"
          chmod 600 "$SSH_DIR/deploy_key" "$SSH_DIR/known_hosts"

      - name: Log in to GHCR
        if: vars.POKETTO_DEPLOY_MODE == 'transfer'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select delivery references
        env:
          DEPLOY_MODE: ${{ vars.POKETTO_DEPLOY_MODE }}
          CANONICAL_IMAGE: ${{ needs.publish.outputs.image }}
          CANONICAL_FRONTEND: ${{ needs.publish.outputs.frontend_image }}
          MIRROR_IMAGE: ${{ needs.mirror.outputs.image }}
          MIRROR_FRONTEND: ${{ needs.mirror.outputs.frontend_image }}
        run: |
          if [ "${DEPLOY_MODE:-pull}" = mirror ]; then
            echo "DELIVERY_IMAGE=$MIRROR_IMAGE" >> "$GITHUB_ENV"
            echo "DELIVERY_FRONTEND=$MIRROR_FRONTEND" >> "$GITHUB_ENV"
          else
            echo "DELIVERY_IMAGE=$CANONICAL_IMAGE" >> "$GITHUB_ENV"
            echo "DELIVERY_FRONTEND=$CANONICAL_FRONTEND" >> "$GITHUB_ENV"
          fi

      - name: Update existing installation
        if: vars.POKETTO_DEPLOY_LAYOUT == 'existing'
        env:
          DEPLOY_TARGET: ${{ secrets.POKETTO_DEPLOY_TARGET }}
          DEPLOY_ROOT: ${{ vars.POKETTO_DEPLOY_ROOT }}
          IMAGE: ${{ env.DELIVERY_IMAGE }}
          FRONTEND_IMAGE: ${{ env.DELIVERY_FRONTEND }}
          DEPLOY_MODE: ${{ vars.POKETTO_DEPLOY_MODE }}
          MIRROR_USERNAME: ${{ vars.POKETTO_MIRROR_USERNAME }}
          MIRROR_PULL_PASSWORD: ${{ secrets.POKETTO_MIRROR_PULL_PASSWORD }}
          REVISION: ${{ github.sha }}
          POKETTO_SSH: ssh -i ${{ runner.temp }}/poketto-ssh/deploy_key -o UserKnownHostsFile=${{ runner.temp }}/poketto-ssh/known_hosts -o StrictHostKeyChecking=yes -o BatchMode=yes
        run: |
          args=(--target "$DEPLOY_TARGET" --root "$DEPLOY_ROOT" --image "$IMAGE"
                --frontend-image "$FRONTEND_IMAGE" --revision "$REVISION" --existing)
          if [ "$DEPLOY_MODE" = mirror ]; then
            printf 'REGISTRY_USERNAME=%s\nREGISTRY_PASSWORD=%s\n' "$MIRROR_USERNAME" "$MIRROR_PULL_PASSWORD" \
              | bash deploy/transfer.sh "${args[@]}" --pull --set-stdin
          else
            bash deploy/transfer.sh "${args[@]}"
          fi

      - name: Deploy
        if: vars.POKETTO_DEPLOY_LAYOUT != 'existing'
        env:
          DEPLOY_TARGET: ${{ secrets.POKETTO_DEPLOY_TARGET }}
          DEPLOY_ROOT: ${{ vars.POKETTO_DEPLOY_ROOT }}
          DEPLOY_MODE: ${{ vars.POKETTO_DEPLOY_MODE }}
          IMAGE: ${{ env.DELIVERY_IMAGE }}
          FRONTEND_IMAGE: ${{ env.DELIVERY_FRONTEND }}
          MIRROR_USERNAME: ${{ vars.POKETTO_MIRROR_USERNAME }}
          MIRROR_PULL_PASSWORD: ${{ secrets.POKETTO_MIRROR_PULL_PASSWORD }}
          REVISION: ${{ github.sha }}
          REPOSITORY_PASSWORD: ${{ secrets.POKETTO_REPOSITORY_PASSWORD }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POKETTO_SSH: ssh -i ${{ runner.temp }}/poketto-ssh/deploy_key -o UserKnownHostsFile=${{ runner.temp }}/poketto-ssh/known_hosts -o StrictHostKeyChecking=yes -o BatchMode=yes
        run: |
          settings=""
          [ -z "$REPOSITORY_PASSWORD" ] || settings="POKETTO_REPOSITORY_PASSWORD=$REPOSITORY_PASSWORD"
          args=(--target "$DEPLOY_TARGET" --root "$DEPLOY_ROOT" --image "$IMAGE"
                --frontend-image "$FRONTEND_IMAGE" --revision "$REVISION" --sync --set-stdin)
          if [ "${DEPLOY_MODE:-pull}" = transfer ]; then
            printf '%s\n' "$settings" | bash deploy/transfer.sh "${args[@]}"
          elif [ "$DEPLOY_MODE" = mirror ]; then
            printf '%s\nREGISTRY_USERNAME=%s\nREGISTRY_PASSWORD=%s\n' "$settings" "$MIRROR_USERNAME" "$MIRROR_PULL_PASSWORD" \
              | bash deploy/transfer.sh "${args[@]}" --pull
          else
            printf '%s\nREGISTRY_USERNAME=%s\nREGISTRY_PASSWORD=%s\n' "$settings" "$GITHUB_ACTOR" "$GITHUB_TOKEN" \
              | bash deploy/transfer.sh "${args[@]}" --pull
          fi

      - name: Record deployment
        if: always()
        env:
          IMAGE: ${{ env.DELIVERY_IMAGE }}
          FRONTEND_IMAGE: ${{ env.DELIVERY_FRONTEND }}
        run: |
          {
            echo "## Production deployment"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Source commit | \`${{ github.sha }}\` |"
            echo "| Application image | \`$IMAGE\` |"
            echo "| Frontend image | \`$FRONTEND_IMAGE\` |"
            echo "| Mode | \`${{ vars.POKETTO_DEPLOY_MODE || 'pull' }}\` |"
            echo "| Layout | \`${{ vars.POKETTO_DEPLOY_LAYOUT || 'standard' }}\` |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
