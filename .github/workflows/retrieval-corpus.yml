name: Retrieval corpus acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - experiments/retrieval-lab/src/worker.ts
      - experiments/retrieval-lab/src/sandcrab.ts
      - experiments/retrieval-lab/src/native-acceptance.ts
      - experiments/retrieval-lab/test/worker-process-fixture.ts
      - experiments/retrieval-lab/python/native_fixture.py
      - experiments/retrieval-lab/python/ci_service.py
      - experiments/retrieval-lab/dataset.json
      - .github/workflows/retrieval-corpus.yml

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      archive_id: ${{ steps.archive.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '26'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - run: ./gradlew buildExecutorRust --no-daemon
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: archive
        with:
          name: retrieval-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/executor-service/bin/sandcrab
            build/executor-service/bin/bwrap
          if-no-files-found: error
          retention-days: 2

  corpus:
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.runtime.outputs.archive_id }}
          path: build/executor-service/bin
          merge-multiple: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Build the independent consumer
        run: |
          npm install --global npm@12.0.2
          npm --prefix experiments/retrieval-lab ci --ignore-scripts --no-audit --no-fund
          npm --prefix experiments/retrieval-lab run build
      - name: Prepare the pinned public corpus
        working-directory: experiments/retrieval-lab
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -r python/requirements.txt
          for stage in fetch audit organize; do
            python python/prepare.py "$stage" --data "$RUNNER_TEMP/fiqa-data"
          done
      - name: Verify the complete corpus through the public sandbox API
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xfsprogs ripgrep
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo --preserve-env=RUNNER_ENVIRONMENT /usr/bin/python3 experiments/retrieval-lab/python/ci_service.py \
            --uid "$(id -u)" --gid "$(id -g)" --binaries build/executor-service/bin \
            --node "$(command -v node)" --data "$RUNNER_TEMP/fiqa-data" --output "$RUNNER_TEMP/fiqa-results"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: retrieval-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fiqa-data/audit.json
            ${{ runner.temp }}/fiqa-data/downloads.json
            ${{ runner.temp }}/fiqa-results/*.json
            ${{ runner.temp }}/fiqa-results/*.log
            ${{ runner.temp }}/fiqa-results/*.stderr
            ${{ runner.temp }}/fiqa-results/client/attempt/summary.json
            ${{ runner.temp }}/fiqa-results/client/attempt/consumer.*
            ${{ runner.temp }}/fiqa-results/client/attempt/client-data/native-acceptance.db*
          if-no-files-found: warn
          retention-days: 30
