name: Retrieval corpus acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - experiments/retrieval-lab/src/worker.ts
      - experiments/retrieval-lab/src/sandcrab.ts
      - experiments/retrieval-lab/src/native-acceptance.ts
      - experiments/retrieval-lab/test/worker-process-fixture.ts
      - experiments/retrieval-lab/python/native_fixture.py
      - experiments/retrieval-lab/python/ci_service.py
      - experiments/retrieval-lab/dataset.json
      - .github/workflows/retrieval-corpus.yml
      - .github/ci/sandcrab-corpus-check.sh
      - acceptance/clients/release-gate.py
      - executor-service/sandcrab-release.properties

permissions:
  contents: read
  pull-requests: read
  statuses: read

jobs:
  corpus:
    name: retrieval-corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Require complete-corpus acceptance for this commit and pinned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 acceptance/clients/release-gate.py require --check corpus --seconds 3300
