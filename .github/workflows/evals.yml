name: Evaluation preflight

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      evidence_mode:
        type: string
        default: scripted
      suite:
        type: string
        default: all
      model:
        type: string
        default: deepseek-flash
      repeats:
        type: number
        default: 3
      budget_usd:
        type: string
        default: '1.00'
    secrets:
      model_key:
        required: false

permissions:
  contents: read

jobs:
  sandcrab:
    # Paid work is manual, on trusted main, once per explicitly started workflow run.
    if: inputs.evidence_mode != 'model' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.evidence_mode == 'model' && 40 || 20 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "26"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.14"
      - name: Install evaluation dependencies
        run: |
          sudo install -d -m 755 /var/lib/sandcrab-evals
          sudo install -d -m 755 -o "$(id -u)" -g "$(id -g)" /var/lib/sandcrab-evals/python
          python -m venv /var/lib/sandcrab-evals/python
          /var/lib/sandcrab-evals/python/bin/python -m pip install --disable-pip-version-check -r evals/requirements.txt
      - name: Check independent grading and failure reports
        run: |
          /var/lib/sandcrab-evals/python/bin/python -m unittest discover -s evals -p 'test_*.py' -v
      - name: Build the native binary
        run: ./gradlew buildExecutorRust --no-daemon
      - name: Prepare the disposable native host
        run: |
          command -v mkfs.xfs || { sudo apt-get update && sudo apt-get install --yes --no-install-recommends xfsprogs; }
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo bash executor-service/prepare-tools.sh /var/lib/sandcrab-evals/tools
      - name: Run Inspect against the disposable native service
        env:
          EVIDENCE_MODE: ${{ inputs.evidence_mode || 'scripted' }}
          EVAL_SUITE: ${{ inputs.suite || 'all' }}
          EVAL_MODEL: ${{ inputs.model || 'deepseek-flash' }}
          EVAL_REPEATS: ${{ inputs.repeats || 3 }}
          EVAL_BUDGET: ${{ inputs.budget_usd || '1.00' }}
          DEEPSEEK_API_KEY: ${{ secrets.model_key }}
        run: |
          sudo --preserve-env=DEEPSEEK_API_KEY python3 evals/native.py --binary build/executor-service/bin/sandcrab \
            --tools /var/lib/sandcrab-evals/tools --python /var/lib/sandcrab-evals/python/bin/python \
            --output /var/lib/sandcrab-evals/results --mode "$EVIDENCE_MODE" --suite "$EVAL_SUITE" --model "$EVAL_MODEL" \
            --epochs "$EVAL_REPEATS" --budget-usd "$EVAL_BUDGET"
      - name: Hand retained reports to the artifact collector
        if: always()
        run: |
          if [ -d /var/lib/sandcrab-evals/results ]; then
            sudo chown --no-dereference -R "$(id -u):$(id -g)" /var/lib/sandcrab-evals/results
          fi
      - name: Publish the readable summary
        if: always()
        run: |
          if [ -f /var/lib/sandcrab-evals/results/summary.md ]; then
            cat /var/lib/sandcrab-evals/results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Native evaluation preflight did not produce a summary. Inspect the failing step.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sandcrab-evals-${{ github.run_id }}-${{ github.run_attempt }}
          path: /var/lib/sandcrab-evals/results/
          if-no-files-found: warn
          retention-days: 14
