name: Sandcrab density measurement

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - experiments/sandcrab-density/**
      - executor-service/**
      - .github/workflows/sandcrab-density.yml
  workflow_dispatch:
    inputs:
      canonical:
        description: Run the full 8/5/4 GB protocol after the smoke check
        type: boolean
        default: false

permissions:
  contents: read

# Keep all attempts and their receipts, including a superseded head's failures.
concurrency:
  group: sandcrab-density-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '26'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Build the static binary
        run: ./gradlew buildExecutorRust --no-daemon
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: density-binary-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/executor-service/bin/sandcrab
          if-no-files-found: error
          retention-days: 14

  measure:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        budget: ${{ fromJSON(inputs.canonical && '[8,5,4]' || '[5]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: density-binary-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/executor-service/bin
      - name: Prepare a disposable native host
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xfsprogs ripgrep bpftrace
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo install -d -m 755 /var/lib/sandcrab-density
          sudo bash executor-service/prepare-tools.sh /var/lib/sandcrab-density/tools
          sudo chown -R root:root /var/lib/sandcrab-density
          sudo chmod -R a+rX,go-w /var/lib/sandcrab-density
          chmod +x build/executor-service/bin/sandcrab
      - name: Check workload, scoring and uncertain outcomes
        run: python3 -m unittest discover -s experiments/sandcrab-density -p 'test_*.py' -v
      - name: Run a small native smoke before measurement
        run: |
          sudo python3 experiments/sandcrab-density/density.py --smoke \
            --binary build/executor-service/bin/sandcrab --tools /var/lib/sandcrab-density/tools \
            --report /var/lib/sandcrab-density/results/smoke.json
      - name: Check the native footprint entry path
        run: |
          sudo python3 experiments/sandcrab-density/footprint.py --smoke \
            --binary build/executor-service/bin/sandcrab --tools /var/lib/sandcrab-density/tools \
            --report /var/lib/sandcrab-density/results/footprint-smoke.json
      - name: Check the page-cache comparison entry path
        run: |
          sudo python3 experiments/sandcrab-density/page_cache.py --smoke \
            --binary build/executor-service/bin/sandcrab --tools /var/lib/sandcrab-density/tools \
            --report /var/lib/sandcrab-density/results/cache-smoke.json
      - name: Trace native session startup
        run: |
          sudo python3 experiments/sandcrab-density/cold_start.py --smoke \
            --binary build/executor-service/bin/sandcrab --tools /var/lib/sandcrab-density/tools \
            --report /var/lib/sandcrab-density/results/cold-start-smoke.json
      - name: Run the canonical protocol in the bounded slice
        if: inputs.canonical
        env:
          MEMORY_GB: ${{ matrix.budget }}
        run: |
          sudo python3 experiments/sandcrab-density/density.py --budget "$MEMORY_GB" \
            --binary build/executor-service/bin/sandcrab --tools /var/lib/sandcrab-density/tools \
            --report /var/lib/sandcrab-density/results/density.json
      - name: Measure fixed costs at 1, 10 and 50
        if: inputs.canonical
        env:
          MEMORY_GB: ${{ matrix.budget }}
        run: |
          sudo python3 experiments/sandcrab-density/footprint.py --budget "$MEMORY_GB" \
            --binary build/executor-service/bin/sandcrab --tools /var/lib/sandcrab-density/tools \
            --report /var/lib/sandcrab-density/results/footprint.json
      - name: Compare ten reflink copies with a shared read-only tree
        if: inputs.canonical
        env:
          MEMORY_GB: ${{ matrix.budget }}
        run: |
          sudo python3 experiments/sandcrab-density/page_cache.py --budget "$MEMORY_GB" \
            --binary build/executor-service/bin/sandcrab --tools /var/lib/sandcrab-density/tools \
            --report /var/lib/sandcrab-density/results/cache.json
      - name: Record repeated startup timelines
        if: inputs.canonical
        env:
          MEMORY_GB: ${{ matrix.budget }}
        run: |
          sudo python3 experiments/sandcrab-density/cold_start.py --budget "$MEMORY_GB" \
            --binary build/executor-service/bin/sandcrab --tools /var/lib/sandcrab-density/tools \
            --report /var/lib/sandcrab-density/results/cold-start.json
      - name: Expose receipts to the collector
        if: always()
        run: |
          if [ -d /var/lib/sandcrab-density/results ]; then
            sudo chown --no-dereference -R "$(id -u):$(id -g)" /var/lib/sandcrab-density/results
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: density-${{ matrix.budget }}gb-${{ github.run_id }}-${{ github.run_attempt }}
          path: /var/lib/sandcrab-density/results/
          if-no-files-found: warn
          retention-days: 30
