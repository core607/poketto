[service]
# Optional SDK protocol adapter; requires the authenticated [tcp] listener below.
opensandbox = false
runtime_root = "/var/lib/sandcrab-demo/runtime"
socket = "/var/lib/sandcrab-demo/runtime/control.sock"
client_uid = 1000
client_gid = 1000
cgroup_root = "/sys/fs/cgroup/sandcrab.slice/sandcrab-demo.service"
daemon_memory_bytes = 134217728
daemon_tasks_max = 128
max_sandboxes = 2
max_records = 128
result_ttl_millis = 300000
max_output_bytes = 8388608
max_file_records = 256
max_file_transfers = 2
max_connections = 32
max_event_streams = 16
max_proxy_connections = 16

# Optional: use a literal loopback address and a root-owned, mode-0600 token file.
# Generate its contents with `openssl rand -hex 32` under umask 077.
# [tcp]
# listen = "127.0.0.1:9011"
# token_file = "/etc/sandcrab-demo/token"

# Optional ordinary-directory volumes; see README.md for enforced XFS quotas.
# [storage]
# root = "/var/lib/sandcrab-demo/storage"
# require_quota = false
# pool_bytes = 1073741824
# max_volume_bytes = 67108864
# max_volume_inodes = 4096
# max_volumes = 8
# max_records = 128

[profiles.python]
exec_user = "sandcrab-exec"
tools = "/opt/sandcrab/tools"
read_only = ["/usr", "/bin", "/lib", "/lib64", "/etc/ld.so.cache"]
memory_bytes = 134217728
temporary_bytes = 16777216
temporary_inodes = 4096
tasks_max = 64
cpu_quota_percent = 50
timeout_millis = 30000
session_ttl_millis = 60000
output_limit_bytes = 65536
transfer_bytes = 33554432
network = "none"
# Optional exact DNS names for CONNECT/SOCKS5 egress; see README.md#network-egress.
# network = { allow = ["pypi.org", "files.pythonhosted.org"] }
# Allow opaque requests to a caller-supplied host service; no handler runs in the daemon.
host_calls = false
