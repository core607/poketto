id: workspace-binary-index
task: Implement index_files.py using the Python standard library. It takes a directory argument, recursively
  indexes regular files, and ignores symlinks (including symlinks to regular files). Read file bytes without
  text decoding. Print one JSON list sorted by the exact case-sensitive relative POSIX path; each object
  has path, bytes (byte count), and sha256 (lowercase hexadecimal). Preserve Unicode names and distinct
  filename case. Test against data, keep the supplied files unchanged, and export your workspace.
fixture:
  files:
    data/example.bin:
      base64: AP9leGFtcGxlCg==
    data/notes.txt: |
      示例
reference:
  files:
    index_files.py: |
      import hashlib
      import json
      from pathlib import Path
      import sys

      root = Path(sys.argv[1])
      rows = []
      for item in root.rglob('*'):
          if item.is_symlink() or not item.is_file():
              continue
          data = item.read_bytes()
          rows.append({'path': item.relative_to(root).as_posix(), 'bytes': len(data),
                       'sha256': hashlib.sha256(data).hexdigest()})
      print(json.dumps(sorted(rows, key=lambda row: row['path'])))
  check:
  - python3 index_files.py data
