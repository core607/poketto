id: workspace-log-repair
task: >-
  Repair summarize.py. Expose summarize(lines) and a CLI that reads JSON Lines from
  stdin. Ignore blank lines, malformed JSON, non-object JSON values, records with a
  missing/empty/non-string service, and records with a non-string or unrecognized level.
  Recognize INFO, WARN and ERROR case-insensitively. Print a JSON list sorted by service,
  with each object containing service, INFO, WARN and ERROR counts (including zeros).
  Run the supplied public tests without modifying them, then export the workspace.
fixture:
  files:
    summarize.py: |
      import json
      import sys

      def summarize(lines):
          counts = {}
          for line in lines:
              item = json.loads(line)
              service = item['service']
              counts.setdefault(service, {'INFO': 0, 'WARN': 0, 'ERROR': 0})
              counts[service][item['level']] += 1
          return [dict(service=name, **value) for name, value in counts.items()]

      if __name__ == '__main__':
          print(json.dumps(summarize(sys.stdin)))
    test_public.py: |
      import unittest
      from summarize import summarize

      class Logs(unittest.TestCase):
          def test_case_and_blank(self):
              result = summarize(['', '{"service":"api","level":"error"}'])
              self.assertEqual([{'service':'api','INFO':0,'WARN':0,'ERROR':1}], result)
          def test_malformed(self):
              self.assertEqual([], summarize(['broken', '[]', '{}']))

      if __name__ == '__main__':
          unittest.main()
reference:
  files:
    summarize.py: |
      import json
      import sys

      def summarize(lines):
          counts = {}
          for line in lines:
              try:
                  item = json.loads(line)
              except (ValueError, TypeError):
                  continue
              if not isinstance(item, dict):
                  continue
              service, level = item.get('service'), item.get('level')
              if not isinstance(service, str) or not service or not isinstance(level, str):
                  continue
              level = level.upper()
              if level not in {'INFO', 'WARN', 'ERROR'}:
                  continue
              counts.setdefault(service, {'INFO': 0, 'WARN': 0, 'ERROR': 0})[level] += 1
          return [dict(service=name, **counts[name]) for name in sorted(counts)]

      if __name__ == '__main__':
          print(json.dumps(summarize(sys.stdin)))
  check: [python3 -m unittest -v test_public]
expected:
  artifacts: [summarize.py]
  preserve: [test_public.py]
  steps:
    - argv: [python3, check_function.py]
      files:
        check_function.py: |
          import json
          import sys
          from summarize import summarize
          print(json.dumps(summarize(sys.stdin)))
      stdin: "\nnot-json\n[]\ntrue\n{\"service\":\"api\",\"level\":\"eRrOr\"}\n"
      stdoutJson: [{service: api, INFO: 0, WARN: 0, ERROR: 1}]
    - argv: [python3, summarize.py]
      stdin: "{\"service\":\"z\",\"level\":\"info\"}\n{\"service\":\"a\",\"level\":\"warn\"}\n{\"service\":\"z\",\"level\":\"INFO\"}\n"
      stdoutJson:
        - {service: a, INFO: 0, WARN: 1, ERROR: 0}
        - {service: z, INFO: 2, WARN: 0, ERROR: 0}
    - argv: [python3, summarize.py]
      stdin: "{}\n{\"service\":3,\"level\":\"INFO\"}\n{\"service\":\"\",\"level\":\"WARN\"}\n{\"service\":\"x\",\"level\":null}\n{\"service\":\"x\",\"level\":\"DEBUG\"}\n"
      stdoutJson: []
