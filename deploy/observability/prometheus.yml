# Scrape targets for the optional monitoring in compose.yaml. Every target is on loopback because
# every service shares the host network. Change 8080 when POKETTO_HTTP_PORT differs.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: poketto-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["127.0.0.1:8080"]

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
