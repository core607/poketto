# Ships Poketto's journald records to the VictoriaLogs in compose.yaml. The application, gateway
# and frontend containers log to journald under the tag poketto-<container>, and the executor, the
# game runner and every command sandbox run as poketto* systemd units, so these three fields select
# all of them and nothing else on the host.
[SERVICE]
    Flush        5
    Log_Level    warn

[INPUT]
    Name              systemd
    Tag               poketto
    Path              /var/log/journal
    DB                /fluent-bit/state/journal.db
    Read_From_Tail    On

[FILTER]
    Name        grep
    Match       poketto
    Logical_Op  or
    Regex       SYSLOG_IDENTIFIER ^poketto
    Regex       _SYSTEMD_UNIT ^poketto
    Regex       _SYSTEMD_SLICE ^poketto

# MESSAGE becomes the log line; the application's line is one ECS JSON record that LogsQL reads
# with unpack_json. Only the container tag is a stream field: sandbox unit names are unique per
# lease and would create one stream each.
[OUTPUT]
    Name              http
    Match             poketto
    Host              127.0.0.1
    Port              9428
    URI               /insert/jsonline?_stream_fields=SYSLOG_IDENTIFIER&_msg_field=MESSAGE&_time_field=date
    Format            json_lines
    Json_Date_Key     date
    Json_Date_Format  iso8601
