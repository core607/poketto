# Production Compose stack for one host. deploy.sh verifies application/frontend revision labels
# and immutable database/gateway references before starting the stack. Every value comes from the .env file beside this file; nothing
# host-specific lives here. deploy.sh parses the file as literal data, exports the values, and
# disables Compose's automatic .env parser.
name: poketto

services:
  app:
    image: "${POKETTO_APP_IMAGE:?POKETTO_APP_IMAGE must name the verified application image}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/${POSTGRES_DB:?POSTGRES_DB is required}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:?POSTGRES_USER is required}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POKETTO_DATA_DIR: /var/lib/poketto
      POKETTO_AUTH_INITIALIZATION_TOKEN: "${POKETTO_AUTH_INITIALIZATION_TOKEN:?initialization token is required}"
      POKETTO_SECURITY_ALLOWED_ORIGINS: "https://${POKETTO_PUBLIC_DOMAIN:?public domain is required}"
      POKETTO_SESSION_COOKIE_SECURE: "true"
      POKETTO_ASSETS_CACHE_MAX_BYTES: "${POKETTO_ASSETS_CACHE_MAX_BYTES:-134217728}"
      POKETTO_ASSETS_MAX_GRANTS: "${POKETTO_ASSETS_MAX_GRANTS:-2048}"
      POKETTO_EXECUTOR_ENABLED: "false"
      POKETTO_REPOSITORY_REMOTE_URI: "${POKETTO_REPOSITORY_REMOTE_URI:?POKETTO_REPOSITORY_REMOTE_URI is required}"
      POKETTO_REPOSITORY_USERNAME: "${POKETTO_REPOSITORY_USERNAME:?POKETTO_REPOSITORY_USERNAME is required}"
      POKETTO_REPOSITORY_PASSWORD: "${POKETTO_REPOSITORY_PASSWORD:?POKETTO_REPOSITORY_PASSWORD is required}"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError"
    ports:
      - "127.0.0.1:${POKETTO_HTTP_PORT:-8080}:8080"
    volumes:
      - "${POKETTO_DATA_DIR_HOST:?POKETTO_DATA_DIR_HOST is required}:/var/lib/poketto"
    mem_limit: "${POKETTO_APP_MEMORY:-1536m}"
    cpus: "${POKETTO_APP_CPUS:-1.0}"
    # JVM baseline of roughly 40 to 60 threads plus Tomcat's 200 request threads; a native-thread
    # failure would exit the container through -XX:+ExitOnOutOfMemoryError.
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s

  db:
    image: "${POKETTO_DB_IMAGE:?POKETTO_DB_IMAGE must name the pinned database image}"
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - "${POKETTO_DB_DIR_HOST:?POKETTO_DB_DIR_HOST is required}:/var/lib/postgresql/data"
    mem_limit: "${POKETTO_DB_MEMORY:-512m}"
    cpus: "${POKETTO_DB_CPUS:-0.75}"
    # The official postgres image starts as root and drops privileges itself, so it keeps its
    # default capabilities.
    pids_limit: 512
    shm_size: 128m
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  frontend:
    image: "${POKETTO_FRONTEND_IMAGE:?verified frontend image is required}"
    restart: unless-stopped
    depends_on:
      app:
        # Public snapshot readiness may fail while authenticated repair remains available.
        condition: service_started
    environment:
      POKETTO_API_BASE_URL: http://app:8080
      POKETTO_PUBLIC_URL: "https://${POKETTO_PUBLIC_DOMAIN:?public domain is required}"
    mem_limit: "${POKETTO_FRONTEND_MEMORY:-384m}"
    cpus: "${POKETTO_FRONTEND_CPUS:-0.75}"
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/admin', {signal: AbortSignal.timeout(10000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 12s
      retries: 8
      start_period: 30s

  gateway:
    image: "${POKETTO_GATEWAY_IMAGE:?pinned gateway image is required}"
    restart: unless-stopped
    user: "${POKETTO_GATEWAY_UID:-10002}:${POKETTO_GATEWAY_UID:-10002}"
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      POKETTO_PUBLIC_DOMAIN: "${POKETTO_PUBLIC_DOMAIN:?public domain is required}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - "${POKETTO_GATEWAY_DIR_HOST:?gateway data directory is required}:/data"
    mem_limit: "${POKETTO_GATEWAY_MEMORY:-128m}"
    cpus: "${POKETTO_GATEWAY_CPUS:-0.5}"
    pids_limit: 128
    read_only: true
    tmpfs:
      - /config:size=16m,uid=${POKETTO_GATEWAY_UID:-10002},gid=${POKETTO_GATEWAY_UID:-10002},mode=0700
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
