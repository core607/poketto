# Errors leave the HTTP boundary as RFC 9457 problem responses; ProblemResponses maps domain failures.
spring.mvc.problemdetails.enabled=true

# Names this service in structured log records. Deployments set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs
# so each record is one JSON line with its context and key values; leaving it unset keeps the
# readable console format for development.
spring.application.name=poketto

poketto.repository.credential-key=${POKETTO_REPOSITORY_CREDENTIAL_KEY:}
poketto.email.api-key=${POKETTO_RESEND_API_KEY:}
poketto.email.from=${POKETTO_EMAIL_FROM:}
poketto.email.daily-limit=${POKETTO_EMAIL_DAILY_LIMIT:100}
poketto.google.client-id=${POKETTO_GOOGLE_CLIENT_ID:}
poketto.google.client-secret=${POKETTO_GOOGLE_CLIENT_SECRET:}
poketto.github.app-id=${POKETTO_GITHUB_APP_ID:}
poketto.github.client-id=${POKETTO_GITHUB_CLIENT_ID:}
poketto.github.client-secret=${POKETTO_GITHUB_CLIENT_SECRET:}
poketto.github.private-key=${POKETTO_GITHUB_PRIVATE_KEY:}
poketto.github.webhook-secret=${POKETTO_GITHUB_WEBHOOK_SECRET:}

# Health is the only management endpoint on the web surface. The public origin never proxies
# /actuator, so deployment checks reach health through the application port directly.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Only the deployment profile enables forwarding with its exact trusted gateway address.
server.forward-headers-strategy=none

# Browser credentials stay in the server-side session, stored in PostgreSQL so restarts keep it.
# A session idles out after 30 minutes until it carries a signed-in account, which then keeps it
# for poketto.security.account-session-idle-days of inactivity. The cookie outlives that bound; the
# server-side expiry decides. Local HTTP development must explicitly override the secure cookie;
# production uses HTTPS and leaves this enabled.
server.servlet.session.cookie.name=POKETTO_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${POKETTO_SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=400d
server.servlet.session.timeout=30m
# Whole days, at least 1; zero or a negative value stops startup rather than silently disabling it.
poketto.security.account-session-idle-days=90
spring.session.jdbc.initialize-schema=never
# Session writes reach PostgreSQL at once, so a removal such as a GitHub disconnect is visible to
# other requests of the same browser while they are still running.
spring.session.jdbc.flush-mode=immediate
server.servlet.session.tracking-modes=cookie
server.tomcat.max-http-form-post-size=16KB
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=17MB

spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.name=poketto
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
spring.ai.mcp.server.tool-change-notification=false
spring.ai.mcp.server.annotation-scanner.enabled=false
spring.ai.mcp.server.tool-callback-converter=false
spring.ai.mcp.server.request-timeout=120s
spring.ai.mcp.server.instructions=Repository tools use server revisions and exact commits. Read current files before patches. Upload acknowledgements do not imply document publication. Tools absent from this server are unavailable.
